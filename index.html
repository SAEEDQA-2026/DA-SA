<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>تطبيق سعيد علي</title>
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209265.png">
    
    <style>
        :root {
            --primary: #0f172a; --accent: #e11d48; --gold: #f59e0b; --success: #10b981; --bg: #f8fafc;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: env(safe-area-inset-top) 15px 20px 15px; color: var(--primary); }
        
        /* الهيدر */
        .app-header { background: linear-gradient(135deg, var(--primary), #1e293b); color: white; border-radius: 0 0 30px 30px; margin: -15px -15px 20px -15px; padding: 40px 20px 25px 20px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: rgba(255,255,255,0.15); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .nav-btn:active { background: var(--gold); }
        
        .main-day { font-size: 3.2rem; font-weight: 900; margin: 0; }
        .main-clock { font-size: 2rem; font-family: monospace; color: var(--gold); margin: 5px 0; font-weight: bold; }
        .date-chip { background: rgba(255,255,255,0.1); padding: 8px 18px; border-radius: 50px; font-size: 0.95rem; border: 1px solid rgba(255,255,255,0.1); margin: 5px; display: inline-block; }

        /* التنبيه */
        #dutyAlert { display: none; background: var(--accent); color: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: center; font-weight: bold; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); border: 2px solid white; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from {transform: translateY(-20px); opacity:0;} to {transform: translateY(0); opacity:1;} }

        /* الكروت */
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 10px solid var(--primary); }
        .card.samar { border-right-color: var(--gold); }
        .card h3 { margin: 0 0 12px 0; font-size: 0.9rem; color: #64748b; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
        .card .val { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        /* تقسيم الفترات */
        .shifts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .s-box { background: #f1f5f9; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .s-box h4 { margin: 0 0 5px 0; font-size: 0.8rem; color: var(--gold); }
        .names { font-size: 0.85rem; line-height: 1.5; color: #334155; white-space: pre-line; font-weight: 500; }

        /* البحث والإعدادات */
        .action-bar { background: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; gap: 10px; }
        input[type="text"], input[type="number"] { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 1rem; outline: none; width: 100%; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* القائمة المنسدلة */
        details { background: white; border-radius: 20px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        summary { padding: 18px; font-weight: bold; cursor: pointer; background: var(--gold); color: white; list-style: none; text-align: center; font-size: 1rem; }
        .s-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px dashed #e2e8f0; font-size: 0.9rem; }

        #configPanel { display: none; background: white; border-radius: 20px; padding: 20px; border: 2px solid #e2e8f0; margin-bottom: 30px; }
        textarea { width: 100%; height: 70px; margin-bottom: 15px; border-radius: 10px; padding: 10px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div id="dutyAlert">⚠️ تنبيه: اليوم استلامك يا "سعيد علي"</div>

    <header class="app-header">
        <div class="nav-row">
            <button class="nav-btn" onclick="nav(-1)">❮</button>
            <h1 id="txtDay" class="main-day">--</h1>
            <button class="nav-btn" onclick="nav(1)">❯</button>
        </div>
        <div id="txtTime" class="main-clock">00:00:00</div>
        <div class="date-row">
            <span id="txtHijri" class="date-chip">--</span>
            <span id="txtGregorian" class="date-chip">--</span>
        </div>
    </header>

    <div class="card samar">
        <h3>👤 السامر المستلم</h3>
        <span id="resSamar" class="val">--</span>
    </div>

    <div class="card">
        <h3>👥 <span id="resTeamTitle">الفرقة المستلمة</span></h3>
        <div class="shifts">
            <div class="s-box">
                <h4>☀️ الصباحية</h4>
                <div id="resMorning" class="names">--</div>
            </div>
            <div class="s-box">
                <h4>🌙 المسائية</h4>
                <div id="resEvening" class="names">--</div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <input type="text" id="nameInput" placeholder="بحث باسم العسكري..." onkeyup="if(event.keyCode===13) search()">
        <button class="btn-main" onclick="search()">بحث</button>
    </div>
    <div id="searchRes" style="display:none; background:#fff9db; padding:15px; border-radius:20px; margin-bottom:20px; border:1px solid #ffe066; font-size: 0.9rem;"></div>

    <details>
        <summary>🗓️ جدول استلامات سعيد علي</summary>
        <div style="background:#f1f5f9; padding:10px; display:flex; gap:10px; border-bottom:1px solid #e2e8f0; align-items:center;">
            <button class="btn-main" style="flex:1; padding:8px; font-size:0.85rem;" onclick="showUpcoming10()">10 القادمة</button>
            <input type="month" id="scheduleMonth" style="flex:1.5; padding:8px; border-radius:10px; border:1px solid #cbd5e1; font-family:inherit; outline:none; font-size:0.9rem;" onchange="showMonthSchedule()">
        </div>
        <div id="saeedSchedule" class="schedule-list"></div>
    </details>

    <button class="btn-main" style="background:#64748b; width:100%; margin-bottom:20px;" onclick="toggleConfig()">⚙️ إعدادات الفرق والتاريخ والأسماء</button>

    <div id="configPanel">
        <h3 style="color:var(--primary); margin-top:0;">تعديل البيانات</h3>
        
        <label><b>🌙 تعديل التاريخ الهجري (أيام +/-):</b></label>
        <input type="number" id="cfgHijriOffset" style="margin-top:5px; margin-bottom:15px;" placeholder="0">
        
        <label><b>السمار (افصل بـ -):</b></label>
        <textarea id="cfgSamar"></textarea>
        <p style="font-size:0.7rem; color:red; margin-top:-10px;">* استخدم علامة | لفصل الصباحي عن المسائي.</p>
        
        <label><b>الفرقة 1:</b></label><textarea id="cfgT1"></textarea>
        <label><b>الفرقة 2:</b></label><textarea id="cfgT2"></textarea>
        <label><b>الفرقة 3:</b></label><textarea id="cfgT3"></textarea>
        
        <button class="btn-main" style="background:var(--success); width:100%" onclick="saveData()">حفظ التعديلات</button>
    </div>

<script>
    // --- المرجع والبيانات الهجرية الدقيقة ---
    const REF_DATE = new Date(2026, 0, 31);
    const REF_HIJRI = { d: 12, m: 8, y: 1447 };

    const hijriMonthLengths = [0, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29];
    const hijriMonthNames = ["", "محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"];

    let currentView = new Date();
    currentView.setHours(0,0,0,0);

    let hijriOffset = JSON.parse(localStorage.getItem('sa_hijri_offset_v4')) || 0;
    let sammar = JSON.parse(localStorage.getItem('sa_sammar_v4')) || ["سعيد علي", "يحي قعوان", "حسن سعيد", "مهدي هادي"];
    let teams = JSON.parse(localStorage.getItem('sa_teams_v4')) || [
        { n: "الفرقة الأولى", m: "عبدالعزيز جوير الله- سعيد عوض\nعبدالله مسعود- سعد سعيد | ملفي محمد - محمد راقع\nمانع علي - مفلح محمد" },
        { n: "الفرقة الثانية", m: "حيان يحيى\nحامد سعيد - مبارك عوض | مبطي سعيد - عبدالله سعد\nمسرع ظافر - خاطر محمد" },
        { n: "الفرقة الثالثة", m: "أحمد الهاجري- علي فايز\nجابر يحيى - عبدالهادي شباب | عبدالله ماهل - ذيب محمد\nعبدالله مهدي" }
    ];

    function calculateHijri(diff) {
        let totalDiff = diff + hijriOffset;
        let d = REF_HIJRI.d;
        let m = REF_HIJRI.m;
        let y = REF_HIJRI.y;

        if (totalDiff > 0) {
            for (let i = 0; i < totalDiff; i++) {
                d++;
                if (d > hijriMonthLengths[m]) {
                    d = 1; m++;
                    if (m > 12) { m = 1; y++; }
                }
            }
        } else if (totalDiff < 0) {
            for (let i = 0; i < Math.abs(totalDiff); i++) {
                d--;
                if (d < 1) {
                    m--;
                    if (m < 1) { m = 12; y--; }
                    d = hijriMonthLengths[m];
                }
            }
        }
        return `${d} ${hijriMonthNames[m]} ${y} هـ`;
    }

    function render() {
        let diff = Math.floor((currentView - REF_DATE) / 86400000);

        // حساب السمار (كل 4 أيام)
        let sIdx = ((diff % 4) + 4) % 4;
        document.getElementById('resSamar').innerText = sammar[sIdx];

        // تنبيه سعيد علي
        const isToday = currentView.toDateString() === new Date().toDateString();
        document.getElementById('dutyAlert').style.display = (isToday && sammar[sIdx] === "سعيد علي") ? "block" : "none";

        // حساب الفرق (كل 3 أيام)
        let tIdx = ((diff % 3) + 3) % 3;
        document.getElementById('resTeamTitle').innerText = teams[tIdx].n;
        let parts = teams[tIdx].m.split('|');
        document.getElementById('resMorning').innerText = parts[0]?.trim() || "-";
        document.getElementById('resEvening').innerText = parts[1]?.trim() || "-";

        // التواريخ
        document.getElementById('txtDay').innerText = currentView.toLocaleDateString('ar-SA', {weekday:'long'});
        document.getElementById('txtGregorian').innerText = currentView.toLocaleDateString('en-GB').replace(/\//g, ' / ') + " م";
        document.getElementById('txtHijri').innerText = calculateHijri(diff);

        buildSaeedSchedule();
    }

    function nav(offset) {
        currentView.setDate(currentView.getDate() + offset);
        render();
    }

    function search() {
        let q = document.getElementById('nameInput').value.trim();
        if(!q) return;
        let res = document.getElementById('searchRes');
        res.style.display = "block";
        res.innerHTML = `<b>نتائج البحث عن (${q}):</b><br>`;
        let found = 0;
        let start = new Date(); start.setHours(0,0,0,0);
        for(let i=-20; i<50; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            let diff = Math.floor((d - REF_DATE) / 86400000);
            let sIdx = ((diff % 4) + 4) % 4;
            let tIdx = ((diff % 3) + 3) % 3;
            if(sammar[sIdx].includes(q) || teams[tIdx].m.includes(q)) {
                res.innerHTML += `<div style="padding:5px 0; border-bottom:1px solid #eee;">
                    ${d.toLocaleDateString('ar-SA', {weekday:'short', day:'numeric', month:'short'})}: 
                    ${sammar[sIdx].includes(q) ? 'سامر' : 'فرقة'}
                </div>`;
                found++;
            }
        }
        if(!found) res.innerHTML += "لا يوجد استلامات قريبة.";
    }

    function buildSaeedSchedule() {
        // تهيئة حقل الشهر بالتاريخ الحالي
        let now = new Date();
        let y = now.getFullYear();
        let m = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('scheduleMonth').value = `${y}-${m}`;
        
        // عرض الـ 10 القادمة بشكل افتراضي
        showUpcoming10();
    }

    function showUpcoming10() {
        const div = document.getElementById('saeedSchedule');
        div.innerHTML = `<div style="text-align:center; padding:10px; font-weight:bold; color:var(--primary); font-size:0.9rem; background:#e2e8f0;">الاستلامات الـ 10 القادمة</div>`;
        
        let today = new Date(); today.setHours(0,0,0,0);
        let count = 0;
        let i = 0;
        
        while(count < 10 && i < 365) {
            let d = new Date(today); d.setDate(today.getDate() + i);
            let diff = Math.floor((d - REF_DATE) / 86400000);
            let sIdx = ((diff % 4) + 4) % 4;
            
            if(sammar[sIdx].includes("سعيد علي")) {
                let statusText = i === 0 ? 'استلام اليوم 🚨' : 'استلام ✅';
                let statusColor = i === 0 ? 'var(--accent)' : 'var(--success)';

                div.innerHTML += `<div class="s-item">
                    <span>${d.toLocaleDateString('ar-SA', {weekday:'long', day:'numeric', month:'short'})}</span>
                    <span style="color:${statusColor}; font-weight:bold;">${statusText}</span>
                </div>`;
                count++;
            }
            i++;
        }
    }

    function showMonthSchedule() {
        let monthVal = document.getElementById('scheduleMonth').value;
        if(!monthVal) return;
        
        let [year, month] = monthVal.split('-');
        let startOfMonth = new Date(year, month - 1, 1);
        let endOfMonth = new Date(year, month, 0);
        
        const div = document.getElementById('saeedSchedule');
        div.innerHTML = `<div style="text-align:center; padding:10px; font-weight:bold; color:var(--primary); font-size:0.9rem; background:#e2e8f0;">استلامات شهر ${month} / ${year}</div>`;
        
        let today = new Date(); today.setHours(0,0,0,0);
        let found = 0;

        for(let d = new Date(startOfMonth); d <= endOfMonth; d.setDate(d.getDate() + 1)) {
            let diff = Math.floor((d - REF_DATE) / 86400000);
            let sIdx = ((diff % 4) + 4) % 4;
            
            if(sammar[sIdx].includes("سعيد علي")) {
                let isPast = d < today;
                let isToday = d.getTime() === today.getTime();
                let statusText = isPast ? 'انتهى' : (isToday ? 'استلام اليوم 🚨' : 'استلام ✅');
                let statusColor = isPast ? '#999' : (isToday ? 'var(--accent)' : 'var(--success)');

                div.innerHTML += `<div class="s-item">
                    <span>${d.toLocaleDateString('ar-SA', {weekday:'long', day:'numeric', month:'short'})}</span>
                    <span style="color:${statusColor}; font-weight:bold;">${statusText}</span>
                </div>`;
                found++;
            }
        }
        
        if(found === 0) {
            div.innerHTML += `<div class="s-item" style="justify-content:center; color:#64748b;">لا يوجد استلامات في هذا الشهر</div>`;
        }
    }

    function toggleConfig() {
        let p = document.getElementById('configPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
        document.getElementById('cfgHijriOffset').value = hijriOffset;
        document.getElementById('cfgSamar').value = sammar.join(' - ');
        document.getElementById('cfgT1').value = teams[0].m;
        document.getElementById('cfgT2').value = teams[1].m;
        document.getElementById('cfgT3').value = teams[2].m;
    }

    function saveData() {
        hijriOffset = parseInt(document.getElementById('cfgHijriOffset').value) || 0;
        sammar = document.getElementById('cfgSamar').value.split('-').map(s => s.trim());
        teams[0].m = document.getElementById('cfgT1').value;
        teams[1].m = document.getElementById('cfgT2').value;
        teams[2].m = document.getElementById('cfgT3').value;
        
        localStorage.setItem('sa_hijri_offset_v4', JSON.stringify(hijriOffset));
        localStorage.setItem('sa_sammar_v4', JSON.stringify(sammar));
        localStorage.setItem('sa_teams_v4', JSON.stringify(teams));
        alert("تم الحفظ بنجاح!");
        location.reload();
    }

    setInterval(() => {
        document.getElementById('txtTime').innerText = new Date().toLocaleTimeString('en-GB', {hour12:false});
    }, 1000);

    render();
</script>
</body>
</html>
